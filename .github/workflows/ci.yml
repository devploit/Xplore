name: CI

# Every push and pull request runs the same checks a release does: typecheck, unit tests, build
# and the guard that fails if the bundle mentions any host other than x.com.
on:
  push:
    branches: ["**"]
    tags-ignore: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run verify

      - name: Package (artifact for manual testing)
        run: node scripts/package.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: xplore-unpacked
          path: release/*.zip
          retention-days: 14
